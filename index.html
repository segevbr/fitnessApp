<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2309090b'/><rect x='2' y='6' width='3' height='4' fill='%2334d399'/><rect x='6' y='7' width='4' height='2' fill='%23e4e4e7'/><rect x='11' y='6' width='3' height='4' fill='%2334d399'/></svg>" />
    <title>FLOATING//QUOTA</title>
    <!-- Apply theme before React renders to prevent flash -->
    <script>
      ;(function(){
        var t = localStorage.getItem('fq-theme')
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.background = dark ? '#09090b' : '#fafafa'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
